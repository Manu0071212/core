# infra/docker/docker-compose.yml
#
# ─── Deployment URL Parameter Configuration ─────────────────────────────────────
# Edit the x-deployment anchor block below. This is the SINGLE source of truth
# for both Next.js build-time variables and runtime environment variables.
#
# After editing, always rebuild and restart the containers:
#
#   docker compose -f infra/docker/docker-compose.yml up -d --build
#
x-deployment: &deployment
  # The public domain name of your deployment (no protocol, no trailing slash)
  MAKERLAB_DOMAIN: "deti-makerlab.ua.pt"
  
  # The base path suffix (e.g. "/new", or "" for root path deployment)
  NEXT_PUBLIC_BASE_PATH: ""
  
  # The public frontend URL (must match domain + base path prefix)
  FRONTEND_URL: "https://deti-makerlab.ua.pt"
  
  # The browser-facing API path prefix (must equal BASE_PATH + "/api")
  NEXT_PUBLIC_API_URL: "/api"
  
  # The full public API URL (must equal domain + API path prefix)
  API_PUBLIC_URL: "https://deti-makerlab.ua.pt/api"
  
  # The browser-facing Snipe-IT path prefix (must equal BASE_PATH + "/snipe-it")
  SNIPEIT_PATH: "/snipe-it"
  
  # The full public Snipe-IT URL for the sidebar link
  NEXT_PUBLIC_SNIPEIT_URL: "https://deti-makerlab.ua.pt/snipe-it"
  
  # The Snipe-IT internal self-URL
  APP_URL: "https://deti-makerlab.ua.pt/snipe-it"
  
  # The public Snipe-IT URL for the backend
  SNIPEIT_PUBLIC_URL: "https://deti-makerlab.ua.pt/snipe-it"

services:
  postgres:
    image: postgres:16
    container_name: makerlab-postgres
    restart: unless-stopped
    env_file:
      - ../db/.env.postgres
    volumes:
      - makerlab_postgres:/var/lib/postgresql/data
      - ../db/init/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      - backend

  api:
    build:
      context: ../../apps/api
    restart: unless-stopped
    container_name: makerlab-api
    env_file: ../../apps/api/.env
    environment:
      <<: *deployment
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "8000:8000"
    networks:
      - backend

  web:
    build:
      context: ../../apps/web
      args:
        <<: *deployment
    restart: unless-stopped
    expose:
      - "3000"
    container_name: makerlab-web
    networks:
      - backend

  snipeit-db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file:
      - ../snipeit/.env.snipeit
    volumes:
      - snipeit_db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  snipeit:
    image: snipe/snipe-it:v8.3.6
    restart: unless-stopped
    env_file:
      - ../snipeit/.env.snipeit
    environment:
      <<: *deployment
    depends_on:
      snipeit-db:
        condition: service_healthy
    volumes:
      - snipeit_storage:/var/lib/snipeit
    expose:
      - "80"
    ports:
      - "8080:80"
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: makerlab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The template dir is processed by nginx at startup (envsubst → conf.d/).
      # Do NOT mount conf.d here — the nginx image writes the rendered template
      # output to /etc/nginx/conf.d/ inside the container at startup, and a
      # read-only bind-mount on that directory causes a fatal crash loop.
      - ../nginx/templates:/etc/nginx/templates:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    environment:
      <<: *deployment
    depends_on:
      - api
      - web
      - snipeit
    networks:
      - backend

volumes:
  makerlab_postgres:
  snipeit_db_data:
  snipeit_storage:


networks:
  backend:
    driver: bridge
