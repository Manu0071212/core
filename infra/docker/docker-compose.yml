# infra/docker/docker-compose.yml

# ─── Deployment URL Configuration ──────────────────────────────────────────────
# All URL-related variables are defined here and propagated to the relevant
# services. To change the public URLs, update ONLY these values and then run:
#
#   docker compose -f infra/docker/docker-compose.yml up -d --build
#
# ── Current testing deployment (under /new) ─────────────────────────────────
#   MAKERLAB_BASE_PATH   = /new
#   MAKERLAB_DOMAIN      = deti-makerlab.ua.pt
#   MAKERLAB_FRONTEND_URL = https://deti-makerlab.ua.pt/new
#   MAKERLAB_SNIPEIT_URL  = https://deti-makerlab.ua.pt/new/snipe-it
#
# ── Final deployment (at root, no prefix) ───────────────────────────────────
#   MAKERLAB_BASE_PATH   = (empty)
#   MAKERLAB_DOMAIN      = deti-makerlab.ua.pt
#   MAKERLAB_FRONTEND_URL = https://deti-makerlab.ua.pt
#   MAKERLAB_SNIPEIT_URL  = https://deti-makerlab.ua.pt/snipe-it
# ────────────────────────────────────────────────────────────────────────────────

# Deployment URL variables — edit these for each environment:
x-deployment: &deployment
  MAKERLAB_DOMAIN: "deti-makerlab.ua.pt"
  MAKERLAB_BASE_PATH: "/new"
  MAKERLAB_FRONTEND_URL: "https://deti-makerlab.ua.pt/new"
  MAKERLAB_SNIPEIT_URL: "https://deti-makerlab.ua.pt/new/snipe-it"
  MAKERLAB_API_URL: "https://deti-makerlab.ua.pt/new/api"

services:
  postgres:
    image: postgres:16
    container_name: makerlab-postgres
    restart: unless-stopped
    env_file:
      - ../db/.env.postgres
    volumes:
      - makerlab_postgres:/var/lib/postgresql/data
      - ../db/init/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    networks:
      - backend

  api:
    build:
      context: ../../apps/api
    restart: unless-stopped
    container_name: makerlab-api
    env_file: ../../apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    ports:
      - "8000:8000"
    networks:
      - backend

  web:
    build:
      context: ../../apps/web
      args:
        # These build args are declared as ARG/ENV in apps/web/Dockerfile and
        # baked into the Next.js bundle at build time (NEXT_PUBLIC_* requirement).
        NEXT_PUBLIC_BASE_PATH: "/new"
        NEXT_PUBLIC_API_URL: "/new/api"
        NEXT_PUBLIC_SNIPEIT_URL: "https://deti-makerlab.ua.pt/new/snipe-it"
    restart: unless-stopped
    expose:
      - "3000"
    container_name: makerlab-web
    networks:
      - backend

  snipeit-db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file:
      - ../snipeit/.env.snipeit
    volumes:
      - snipeit_db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  snipeit:
    image: snipe/snipe-it:v8.3.6
    restart: unless-stopped
    env_file:
      - ../snipeit/.env.snipeit
    depends_on:
      snipeit-db:
        condition: service_healthy
    volumes:
      - snipeit_storage:/var/lib/snipeit
    expose:
      - "80"
    ports:
      - "8080:80"
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: makerlab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The template dir is processed by nginx at startup (envsubst → conf.d/).
      # Do NOT mount conf.d here — the nginx image writes the rendered template
      # output to /etc/nginx/conf.d/ inside the container at startup, and a
      # read-only bind-mount on that directory causes a fatal crash loop.
      - ../nginx/templates:/etc/nginx/templates:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    environment:
      # nginx envsubst variables — derived from the deployment settings above.
      # The nginx image substitutes these into default.conf.template at startup.
      NGINX_FRONTEND_HOST: "deti-makerlab.ua.pt"
      NGINX_BASE_PATH: "/new"
      NGINX_API_PATH: "/new/api"
      NGINX_SNIPEIT_PATH: "/new/snipe-it"
      NGINX_FRONTEND_URL: "https://deti-makerlab.ua.pt/new"
      NGINX_SNIPEIT_URL: "https://deti-makerlab.ua.pt/new/snipe-it"
      NGINX_API_URL: "https://deti-makerlab.ua.pt/new/api"
    depends_on:
      - api
      - web
      - snipeit
    networks:
      - backend

volumes:
  makerlab_postgres:
  snipeit_db_data:
  snipeit_storage:


networks:
  backend:
    driver: bridge
