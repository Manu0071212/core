# infra/nginx/conf.d/default.conf

upstream api {
    server api:8000;
}

upstream snipeit {
    server snipeit:80;
}

upstream frontend {
    server web:3000;
}

server {
    listen 80;
    server_name deti-makerlab.ua.pt;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name deti-makerlab.ua.pt;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    location = /auth/auth {
        proxy_pass http://api/auth/sso/callback$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /new/api/ {
        rewrite ^/new/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /new/snipe-it/ {
        auth_request /auth-verify;

        auth_request_set $sso_user $upstream_http_x_remote_user;
        proxy_set_header X-Remote-User $sso_user;

        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;

        error_page 401 = @error401_snipeit;
        error_page 403 = @error403_snipeit;

        rewrite ^/new/snipe-it/(.*) /$1 break;
        proxy_pass http://snipeit;
        proxy_redirect https://deti-makerlab.ua.pt/api/auth/logout https://deti-makerlab.ua.pt/api/auth/logout;
        proxy_redirect http://deti-makerlab.ua.pt/api/auth/logout https://deti-makerlab.ua.pt/api/auth/logout;
        proxy_redirect https://deti-makerlab.ua.pt/new/snipe-it/ https://deti-makerlab.ua.pt/new/snipe-it/;
        proxy_redirect http://deti-makerlab.ua.pt/new/snipe-it/ https://deti-makerlab.ua.pt/new/snipe-it/;
        proxy_redirect https://deti-makerlab.ua.pt/new/snipe-it https://deti-makerlab.ua.pt/new/snipe-it/;
        proxy_redirect http://deti-makerlab.ua.pt/new/snipe-it https://deti-makerlab.ua.pt/new/snipe-it/;
        proxy_redirect https://deti-makerlab.ua.pt/ https://deti-makerlab.ua.pt/new/snipe-it/;
        proxy_redirect http://deti-makerlab.ua.pt/ https://deti-makerlab.ua.pt/new/snipe-it/;
        proxy_redirect https://deti-makerlab.ua.pt https://deti-makerlab.ua.pt/new/snipe-it/;
        proxy_redirect http://deti-makerlab.ua.pt https://deti-makerlab.ua.pt/new/snipe-it/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /new/snipe-it;
    }

    location @error401_snipeit {
        return 302 https://deti-makerlab.ua.pt/api/auth/sso/login/mobile?web_redirect=https://deti-makerlab.ua.pt/new/snipe-it/;
    }

    location @error403_snipeit {
        return 403 "Forbidden: Only lab technicians have access to SnipeIT.";
    }

    location = /auth-verify {
        internal;
        proxy_pass http://api/auth/snipeit/verify$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Cookie $http_cookie;
    }

    location = /new {
        proxy_pass http://frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    location /new/ {
        proxy_pass http://frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 301 /new;
    }
}